[package]
name = "db-connect"
version = "0.1.0"
description = "Lightweight DB client"
edition = "2021"

[lib]
name = "db_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "mysql", "sqlite", "macros"] }
libsqlite3-sys = { version = "0.30", default-features = false }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
redis = { version = "1.7", default-features = false, features = ["tokio-native-tls-comp"] }
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-native-tls", "fail-on-err"] }
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio", "tokio-async-native-tls", "deprecated"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
